name: Project quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      NLP_BACKEND: baseline
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev,quality]'
      - name: Check Python rules
        run: python -m ruff check app tests scripts
      - name: Test API, documents and NLP contracts
        run: python -m pytest -q -rs --junitxml=reports/pytest.xml
      - name: Save measured test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python }}
          path: reports/pytest.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Reject lint warnings
        run: npm run lint
      - name: Test interface behavior
        run: npm test
      - name: Check types and build
        run: npm run build
