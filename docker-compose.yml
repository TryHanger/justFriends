services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    volumes:
      # NLP dictionaries, RAG knowledge and prompt examples are runtime data.
      - ./data:/service/data:ro
      # Local fine-tuned checkpoints; ignored by Git because they are large artifacts.
      - ./models:/service/models:ro
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://metaphor:metaphor@db:5432/metaphors
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      NLP_BACKEND: ${NLP_BACKEND:-baseline}
      QUALITY_RUNNER_ENABLED: ${QUALITY_RUNNER_ENABLED:-false}
      QUALITY_FRONTEND_WORKER_ENABLED: ${QUALITY_RUNNER_ENABLED:-false}
      EXPERIMENTAL_KK_XLMR_MODEL_PATH: ${EXPERIMENTAL_KK_XLMR_MODEL_PATH:-models/xlmr-kk-silver-pilot-v2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    depends_on:
      db:
        condition: service_healthy
      frontend-checks:
        condition: service_started
    networks:
      - default
      - checks_internal
    restart: unless-stopped

  frontend-checks:
    build:
      context: ./frontend
      dockerfile: Dockerfile.checks
    environment:
      QUALITY_RUNNER_ENABLED: ${QUALITY_RUNNER_ENABLED:-false}
    networks:
      - checks_internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metaphors
      POSTGRES_USER: metaphor
      POSTGRES_PASSWORD: metaphor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaphor -d metaphors"]
      interval: 5s
      timeout: 5s
      retries: 10

  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - label_studio_data:/label-studio/data
    restart: unless-stopped

volumes:
  postgres_data:
  label_studio_data:

networks:
  checks_internal:
    internal: true
