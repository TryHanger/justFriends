services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://metaphor:metaphor@db:5432/metaphors
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metaphors
      POSTGRES_USER: metaphor
      POSTGRES_PASSWORD: metaphor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaphor -d metaphors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

