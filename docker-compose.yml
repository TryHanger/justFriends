services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://metaphor:metaphor@db:5432/metaphors
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      NLP_BACKEND: ${NLP_BACKEND:-baseline}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metaphors
      POSTGRES_USER: metaphor
      POSTGRES_PASSWORD: metaphor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaphor -d metaphors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

