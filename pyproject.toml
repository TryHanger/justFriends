[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaphor-analyzer-api"
version = "0.1.0"
description = "API for metaphor analysis in Chinese and Kazakh poetry"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "openai>=1.50,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
nlp = [
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
  "sentence-transformers>=5,<6",
  "sentencepiece>=0.2,<1",
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
